[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "ddl-lineage"
version     = "2.0.0"
description = "SQL DDL lineage analyzer — tables, views, functions, column-level lineage"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"
keywords    = ["sql", "ddl", "lineage", "data-lineage", "database", "schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No runtime dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
ddl-lineage = "ddl_lineage.cli:main"

[project.urls]
"Source Code" = "https://github.com/yourorg/ddl-lineage"
"Bug Tracker" = "https://github.com/yourorg/ddl-lineage/issues"

# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["ddl_lineage*"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict         = false
ignore_missing_imports = true
