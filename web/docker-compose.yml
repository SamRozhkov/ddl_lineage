version: '3.8'

services:
  ddl-lineage-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=web.app
      - FLASK_ENV=development
    volumes:
      - ../ddl_lineage:/app/ddl_lineage
      - ../web:/app/web
    command: python web/app.py
